# Compila la app Navio para Android y la publica como descarga.
#
# Se ejecuta sola cuando cambia algo dentro de android-app/, o a mano desde la
# pestaña "Actions" de GitHub (botón "Run workflow").
#
# Resultado: una "Release" con el archivo navio.apk. El enlace
#   https://github.com/Tegesu/Navio/releases/latest/download/navio.apk
# siempre descarga la versión más reciente.
#
# Firma: si el repositorio tiene los secretos NAVIO_KEYSTORE_BASE64 y
# NAVIO_KEYSTORE_PASSWORD, la app sale firmada con esa llave y cada versión
# nueva se instala encima de la anterior. Sin ellos sale una versión de
# prueba: funciona igual, pero para actualizarla hay que desinstalar primero.
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        working-directory: android-app
        run: npm ci

      - name: Preparar el proyecto Android
        working-directory: android-app
        run: npx cap sync android

      - name: Llave de firma (si está configurada)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NAVIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navio.jks"
            echo "file=$RUNNER_TEMP/navio.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        working-directory: android-app/android
        env:
          NAVIO_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          NAVIO_KEYSTORE_PASSWORD: ${{ secrets.NAVIO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$NAVIO_KEYSTORE_FILE" ]; then VARIANT=Release; else VARIANT=Debug; fi
          ./gradlew "assemble$VARIANT" "-PnavioVersionCode=${{ github.run_number }}" --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/navio.apk"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - name: Publicar la descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          if [ "$VARIANT" = "Release" ]; then NOTE="Versión firmada: se instala encima de la anterior."; else NOTE="Versión de prueba: para instalar una más nueva, primero desinstala esta."; fi
          gh release create "app-v$VERSION" navio.apk \
            --title "Navio para Android $VERSION" \
            --notes "App Navio para Android. Registra el viaje aunque la pantalla esté apagada. $NOTE" \
            --latest
